name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          zip -r member-verification.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "*.md"

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: member-verification.zip
